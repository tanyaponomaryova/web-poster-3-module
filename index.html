<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUG LAB</title>
  </head>

  <body>
    <!-- #region Шапка -->
    <header id="site-header">
      <button id="header-logo">
        <img src="/public/bug-lab.svg" />
      </button>
      <img id="header-ap" src="/public/ap-26.svg" />
    </header>

    <!-- #endregion Шапка -->

    <!-- #region Маскот -->
    <!-- плашка под маскотом -->
    <div class="mascot-widget">
      <!-- всплывающая плашка с комментариями -->
      <div class="mascot-message transparent-material">
        <span>Hello</span>
      </div>

      <div class="mascot-head-wrap transparent-material">
        <!-- белая "голова" -->
        <button class="mascot-head"></button>
        <!-- движущееся "лицо" -->
        <div class="mascot-face">
          <img
            src="/mascot-face.svg"
            alt=""
            class="trigger hover-target"
            data-mascot-event="click"
            data-mascot-message="МОЁ ЛИЦО! не тыкай ялляляляляля лдылоаджлажшоваол snkdfnkjfn"
          />
        </div>
      </div>
    </div>
    <!-- #endregion -->

    <section
      class="section trigger click-target"
      id="hero-section"
      data-mascot-event="both"
      data-mascot-message="Hero section"
    >
      <div class="hero-canvas-wrapper">
        <canvas class="hero-webgl"></canvas>
      </div>
    </section>

    <section class="section" id="creation-section">
      <!-- #region Панели  -->
      <!-- ===================== ПАНЕЛЬ 1: только color picker ===================== -->
      <!-- data-color-target задаёт имя, под которым выбранный цвет появится
         в window.panelColors и в событии colorchange -->
      <!-- ЦВЕТ ТЕЛА -->
      <div
        id="panel-body-color"
        class="panel transparent-material panel--anchored"
        data-color-target="bodyColor"
        style="display: none"
      >
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/public/Body Color icon.svg" alt="" />
          </span>
          <span>цвет тела:</span>
        </div>
        <!-- внутреннее содержание панели -->
        <div class="panel-content">
          <div class="hue-slider-wrap">
            <div class="hue-slider" data-hue="300">
              <div class="thumb">
                <div class="thumb-fill"></div>
                <div class="preview-bubble"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ФОРМА ГЛАЗ -->
      <!-- data-option-target на .icon-select задаёт имя переменной, на которую влияет выбор.
       data-default (необязательно) — какой вариант выбран изначально. -->
      <div
        id="panel-eye-shape"
        class="panel transparent-material panel--anchored"
        data-color-target="eyeColor"
        style="display: none"
      >
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/public/Eyes icon.svg" alt="" />
          </span>
          <span>глаза:</span>
        </div>
        <!-- внутреннее содержание панели -->
        <div class="panel-content">
          <div
            class="icon-select"
            data-option-target="eyeShapeName"
            data-default="Circle"
          >
            <button class="icon-btn" data-value="Circle" aria-label="Круг">
              <svg
                class="icon-btn-svg"
                width="50"
                height="50"
                viewBox="0 0 50 50"
              >
                <circle cx="25.4624" cy="25.4624" r="18.8544" />
              </svg>
            </button>
            <button class="icon-btn" data-value="Heart" aria-label="Сердце">
              <svg
                class="icon-btn-svg"
                width="50"
                height="50"
                viewBox="0 0 50 50"
              >
                <path
                  d="M35.3223 7.61426C37.7206 7.53052 39.6786 8.28682 41.1699 9.61719C42.6549 10.9419 43.6563 12.8159 44.1914 14.9414C45.26 19.186 44.4933 24.5169 41.8906 28.7812C38.5421 34.2675 32.4592 39.0293 28.3545 41.6943C26.6934 42.7728 24.5722 42.7728 22.9111 41.6943C18.8064 39.0293 12.7235 34.2675 9.375 28.7812C6.77235 24.5169 6.00657 19.186 7.0752 14.9414C7.61031 12.816 8.61079 10.9419 10.0957 9.61719C11.5871 8.28682 13.545 7.53052 15.9434 7.61426C17.8645 7.68134 19.3081 8.27474 20.4258 9.13867C21.5366 9.99744 22.3065 11.1089 22.9082 12.1816C23.2091 12.718 23.4715 13.2515 23.7119 13.7402C23.9546 14.2334 24.172 14.6761 24.3916 15.0518C24.8502 15.8362 25.2213 16.1552 25.6328 16.1553C26.0443 16.1553 26.4154 15.8362 26.874 15.0518C27.0936 14.6761 27.3111 14.2334 27.5537 13.7402C27.7942 13.2515 28.0566 12.718 28.3574 12.1816C28.9591 11.1089 29.729 9.99744 30.8398 9.13867C31.9575 8.27473 33.4012 7.68136 35.3223 7.61426Z"
                />
              </svg>
            </button>
            <button class="icon-btn" data-value="Star" aria-label="Звезда">
              <svg
                class="icon-btn-svg"
                width="50"
                height="50"
                viewBox="0 0 50 50"
              >
                <path
                  d="M22.0938 7.25928C23.2466 5.30317 26.1098 5.30317 27.2627 7.25928L31.6406 14.688C32.1746 15.594 33.0686 16.2352 34.1025 16.4565L42.6045 18.2759C44.8477 18.7559 45.7228 21.4404 44.2021 23.1226L38.4062 29.5337C37.6997 30.3152 37.3569 31.3553 37.4639 32.3999L38.3408 40.9536C38.5701 43.1949 36.2629 44.8653 34.1582 43.9487L26.1982 40.4819C25.2296 40.0601 24.1259 40.0601 23.1572 40.4819L15.1973 43.9487C13.0925 44.8653 10.7863 43.195 11.0156 40.9536L11.8916 32.3999C11.9986 31.3553 11.6558 30.3152 10.9492 29.5337L5.15332 23.1226C3.63286 21.4404 4.5078 18.7559 6.75098 18.2759L15.2529 16.4565C16.287 16.2352 17.1807 15.594 17.7148 14.688L22.0938 7.25928Z"
                />
              </svg>
            </button>
          </div>

          <div class="hue-slider-wrap">
            <div class="hue-glow"></div>
            <div class="hue-slider" data-hue="140">
              <div class="thumb">
                <div class="thumb-fill"></div>
                <div class="preview-bubble"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ФОРМА ГОЛОВЫ -->
      <div
        id="panel-head-shape"
        class="panel transparent-material panel--anchored"
        style="display: none"
      >
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/public/Head icon.svg" alt="" />
          </span>
          <span>форма головы:</span>
        </div>
        <div class="panel-content">
          <div
            class="icon-select"
            data-option-target="headShapeName"
            data-default="Antennae"
          >
            <button
              class="icon-btn"
              data-value="Antennae"
              aria-label="Усики Жука"
            >
              <svg
                class="icon-btn-svg"
                width="50"
                height="50"
                viewBox="0 0 50 50"
              >
                <path
                  d="M30.2833 26.4126C30.3165 26.2007 30.355 25.9824 30.3992 25.7607C30.6134 24.686 30.9934 23.3715 31.6789 22.2918C32.14 21.5655 32.8532 21.0284 33.4851 20.6334C34.1484 20.2188 34.9058 19.8508 35.6185 19.5284C35.9666 19.3708 36.4101 19.1784 36.8193 19.0008C37.1378 18.8627 37.4358 18.7333 37.6525 18.6363C38.2849 18.353 38.7026 18.1399 38.9323 17.9792C39.2058 17.7877 39.472 17.5746 39.7285 17.3463C40.6872 16.4927 40.9802 15.1145 41.1134 13.802C41.3029 11.933 41.9012 9.89323 42.4367 8.92271C43.453 7.08079 45.699 6.45279 47.4531 7.52003C49.2072 8.58726 49.8053 10.9456 48.7889 12.7875C48.2022 13.8507 46.5926 15.6208 44.9991 16.7221C44.3936 17.1405 43.8254 17.6249 43.3525 18.2019C42.5987 19.1216 41.6933 20.017 40.6775 20.728C40.1755 21.0795 39.5063 21.3977 38.8872 21.675C38.534 21.8332 38.2368 21.9615 37.9424 22.0885C37.607 22.2333 37.2739 22.377 36.8634 22.5628C36.1859 22.8693 35.5785 23.1698 35.0941 23.4726C34.5783 23.7951 34.36 24.0247 34.2967 24.1244C33.9335 24.6966 33.658 25.5388 33.4789 26.4372C33.3656 27.0056 33.3033 27.5325 33.2732 27.9259C34.1425 28.5046 34.9487 29.1784 35.6785 29.9333C37.8394 32.1687 38.801 33.9212 39.5393 37.0106C39.8217 38.192 39.9716 39.4285 39.9716 40.7019V41.7515C39.9716 43.2267 38.8327 44.4227 37.4278 44.4227H12.0271C10.6222 44.4227 9.4833 43.2267 9.4833 41.7515V40.7019C9.4833 39.2564 9.67651 37.8584 10.0373 36.5346C10.8883 33.4122 11.9377 31.6579 14.233 29.481C15.0315 28.7237 15.9113 28.059 16.8569 27.5031C16.841 27.4125 16.8238 27.3204 16.8052 27.2272C16.6261 26.3288 16.3507 25.4866 15.9874 24.9144C15.9241 24.8148 15.7058 24.5851 15.19 24.2627C14.7056 23.9599 14.0982 23.6594 13.4207 23.3528C13.0104 23.1672 12.6763 23.023 12.341 22.8783C12.0466 22.7512 11.7501 22.6233 11.3969 22.4651C10.7779 22.1877 10.1087 21.8696 9.60662 21.5181C8.59085 20.807 7.68544 19.9116 6.9316 18.9919C6.45872 18.415 5.89051 17.9306 5.28498 17.5121C3.69152 16.4108 2.08193 14.6408 1.49524 13.5776C0.478876 11.7357 1.07694 9.37732 2.83106 8.31009C4.58517 7.24285 6.83109 7.87086 7.84745 9.71277C8.38297 10.6833 8.98121 12.7231 9.17078 14.5921C9.30391 15.9045 9.59692 17.2828 10.5557 18.1363C10.8121 18.3647 11.0783 18.5777 11.3519 18.7692C11.5815 18.93 11.9992 19.143 12.6316 19.4263C12.8484 19.5234 13.1466 19.6528 13.4651 19.7911C13.8744 19.9686 14.3175 20.1609 14.6657 20.3184C15.3783 20.6409 16.1357 21.0088 16.7991 21.4235C17.4309 21.8184 18.1441 22.3555 18.6052 23.0818C19.2174 24.046 19.5859 25.1975 19.8104 26.1982C21.1004 25.7998 22.4657 25.5861 23.8785 25.5861H25.5764C27.2248 25.5861 28.8084 25.877 30.2833 26.4126Z"
                />
              </svg>
            </button>
            <button
              class="icon-btn"
              data-value="Deer_Horns"
              aria-label="Рога Жука Оленя"
            >
              <svg
                class="icon-btn-svg"
                width="50"
                height="50"
                viewBox="0 0 50 50"
              >
                <path
                  d="M16.5042 21.9588L16.3524 22.0871M16.3524 22.0871C14.7551 23.4355 12.8785 25.0197 13.5092 27.8761C13.674 28.6229 13.901 29.2835 14.1597 29.8686C16.7168 27.5441 20.1053 26.1288 23.8223 26.1288H25.5231C29.4663 26.1288 33.0398 27.7216 35.6431 30.3029C35.9861 29.6158 36.291 28.8138 36.4981 27.8759C37.1287 25.0195 35.2521 23.4354 33.6548 22.087L33.503 21.9587C31.8761 20.5817 30.8037 18.1255 32.5786 16.7486C33.9985 15.647 35.7832 17.2075 36.4981 18.1255C35.9557 17.0339 34.5975 14.5231 33.503 13.2131C32.1349 11.5756 31.3214 8.97055 33.503 7.70523C35.6846 6.43991 38.125 6.88649 39.641 8.97055C41.157 11.0546 44.1151 17.1579 44.0042 24.5638C43.9154 30.4885 40.9281 35.3617 39.5107 37.0984C39.7936 38.2328 39.9438 39.4201 39.9438 40.6427V41.6506C39.9438 43.0671 38.8029 44.2154 37.3955 44.2154H11.9499C10.5425 44.2154 9.40161 43.0671 9.40161 41.6506V40.6427C9.40161 39.2549 9.59516 37.9125 9.95658 36.6414C8.46224 34.5537 6.08388 29.9614 6.00303 24.5639C5.89211 17.1581 8.85019 11.0548 10.3662 8.9707C11.8822 6.88664 14.3226 6.44006 16.5042 7.70538C18.6858 8.9707 17.8723 11.5758 16.5042 13.2132C15.4097 14.5232 14.0515 17.034 13.5092 18.1257C14.224 17.2077 16.0087 15.6471 17.4286 16.7487C19.2035 18.1257 18.1312 20.5819 16.5042 21.9588C16.454 22.0014 16.4033 22.0441 16.3524 22.0871Z"
                />
              </svg>
            </button>
            <button
              class="icon-btn"
              data-value="Rhino_Horns"
              aria-label="Рога Жука Носорога"
            >
              <svg
                class="icon-btn-svg"
                width="50"
                height="50"
                viewBox="0 0 50 50"
              >
                <path
                  d="M18.6287 27.2085C18.6203 27.2365 18.6122 27.2645 18.6044 27.2925C13.5378 29.5444 10 34.6618 10 40.6143V41.6244C10 43.0441 11.1388 44.1949 12.5436 44.1949H37.9414C39.3462 44.1949 40.485 43.0441 40.485 41.6244V40.6143C40.485 34.662 36.9473 29.5447 31.881 27.2927C31.8732 27.2646 31.8651 27.2366 31.8567 27.2086L28.0658 14.5585C27.7562 13.5255 27.8276 12.3983 28.4238 11.5027C29.2471 10.2661 30.4402 8.90555 31.6676 8.65612C32.6529 8.45589 32.3422 7.35321 31.6292 6.14317C30.7269 4.61177 28.6113 4.66671 27.4665 6.02251C26.2994 7.40469 24.186 7.40469 23.0189 6.02251C21.8741 4.66671 19.7585 4.61177 18.8561 6.14317C18.1431 7.35321 17.8325 8.45589 18.8178 8.65612C20.0452 8.90555 21.2383 10.2661 22.0616 11.5027C22.6578 12.3983 22.7292 13.5255 22.4196 14.5585L18.6287 27.2085Z"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Длина ТЕЛА -->
      <div
        id="panel-body-length"
        class="panel transparent-material panel--anchored"
        style="display: none"
      >
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/public/Body Shape icon.svg" alt="" />
          </span>
          <span>длина тела:</span>
        </div>
        <!-- внутреннее содержание панели -->
        <div class="panel-content">
          <div
            class="icon-select"
            data-option-target="bodyShapeName"
            data-default="Body_Medium"
          >
            <button
              class="icon-btn"
              data-value="Body_Short"
              aria-label="Короткое тело"
            >
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8" />
              </svg>
            </button>
            <button
              class="icon-btn"
              data-value="Body_Medium"
              aria-label="Среднее тело"
            >
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <path
                  d="M12 20.5s-7.5-4.9-9.8-9.4C.6 7.9 2 4.6 5.1 3.9c1.9-.4 3.7.5 4.9 2.1 1.2-1.6 3-2.5 4.9-2.1 3.1.7 4.5 4 2.9 7.2C19.5 15.6 12 20.5 12 20.5z"
                />
              </svg>
            </button>
            <button
              class="icon-btn"
              data-value="Body_Long"
              aria-label="Длинное тело"
            >
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <path
                  d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.86L12 17.77l-6.18 3.23L7 14.14 2 9.27l7.1-1.01L12 2z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- РИСУНОК НА КРЫЛЬЯХ -->
      <!-- data-color-target="brushColor" -- цвет кисти для p5-холста, работает
           через тот же hue-slider, что и остальные панели.
           icon-select с data-option-target="brushSize" -- три размера кисти,
           значение (px в координатах текстуры) берётся из data-value кнопок. -->
      <div
        id="panel-wings"
        class="panel transparent-material panel--anchored"
        data-color-target="brushColor"
        style="display: none"
      >
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/public/Drawing icon.svg" alt="" />
          </span>
          <span>рисунок на крыльях:</span>
        </div>
        <!-- внутреннее содержание панели -->
        <div class="panel-content">
          <!-- холст для рисования + трафарет крыльев поверх него -->
          <div class="wing-canvas-wrap">
            <div id="wingP5Container" class="wing-p5-container"></div>
            <img
              id="wingMaskOverlay"
              class="wing-mask-overlay"
              src="/mask-wing-long.svg"
              alt=""
            />
          </div>

          <div class="hue-slider-wrap">
            <div class="hue-slider" data-hue="330">
              <div class="thumb">
                <div class="thumb-fill"></div>
                <div class="preview-bubble"></div>
              </div>
            </div>
          </div>

          <!-- ряд: размер кисти + очистить (в одну линию) -->
          <div class="wing-controls-row">
            <!-- радиус кружка = data-value / 2 -- то есть кружок
                 физически того же диаметра, что и линия, которую
                 оставляет кисть с таким же strokeWeight на p5Canvas -->
            <div
              class="icon-select"
              data-option-target="brushSize"
              data-default="10"
            >
              <button
                class="icon-btn"
                data-value="4"
                aria-label="Маленькая кисть"
              >
                <svg class="icon-btn-svg" viewBox="0 0 44 44">
                  <circle cx="22" cy="22" r="2" />
                </svg>
              </button>
              <button
                class="icon-btn"
                data-value="10"
                aria-label="Средняя кисть"
              >
                <svg class="icon-btn-svg" viewBox="0 0 44 44">
                  <circle cx="22" cy="22" r="5" />
                </svg>
              </button>
              <button
                class="icon-btn"
                data-value="18"
                aria-label="Крупная кисть"
              >
                <svg class="icon-btn-svg" viewBox="0 0 44 44">
                  <circle cx="22" cy="22" r="9" />
                </svg>
              </button>
            </div>

            <button
              type="button"
              class="wing-clear-btn"
              aria-label="Очистить рисунок"
            >
              <svg
                class="wing-clear-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 7h16" />
                <path d="M9.5 7V4.5h5V7" />
                <path
                  d="M6.5 7l0.8 12.2a2 2 0 0 0 2 1.8h5.4a2 2 0 0 0 2-1.8L17.5 7"
                />
                <path d="M10.2 11v6" />
                <path d="M13.8 11v6" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- #endregion Панели -->
      <!-- ЖУК -->
      <div id="canvas-buttons-wrapper">
        <button
          class="anchored-button anchored-button-eyes transparent-material"
          data-anchor-panel="panel-eye-shape"
        >
          <img src="public/Eyes icon.svg" alt="" />
          <span class="label">глаза</span>
        </button>
        <button
          class="anchored-button anchored-button-wings transparent-material"
          data-anchor-panel="panel-wings"
        >
          <img src="public/Drawing icon.svg" alt="" />
          <span class="label">рисунок на крыльях</span>
        </button>
        <button
          class="anchored-button anchored-button-body-color transparent-material"
          data-anchor-panel="panel-body-color"
