    <!-- #region Шапка -->
    <header id="site-header">
      <button id="header-logo">
        <img src="/web-poster-3-module/bug-lab.svg" />
      </button>
      <img id="header-ap" src="/web-poster-3-module/ap-26.svg" />
    </header>

    <!-- #endregion Шапка -->

    <!-- #region Маскот -->
    <!-- плашка под маскотом -->
    <div class="mascot-widget">
      <!-- всплывающая плашка с комментариями -->
      <div class="mascot-message transparent-material">
        <span>Hello</span>
      </div>

      <div class="mascot-head-wrap transparent-material">
        <!-- белая "голова" -->
        <button class="mascot-head"></button>
        <!-- движущееся "лицо" -->
        <div class="mascot-face">
          <img
            src="/web-poster-3-module/mascot-face.svg"
            alt=""
            class="hover-target"
            data-mascot-event="click"
            data-mascot-messages="я твой помощник на этом сайте | ай! | листай дальше, там что-то интересное! | ну хватит || МОЁ ЛИЦО! не тыкай! |"
          />
        </div>
      </div>
    </div>
    <!-- #endregion -->

    <section
      class="section click-target"
      id="hero-section"
      data-mascot-event="both"
      data-mascot-messages="добро пожаловать!
      создайте своего жука в bug lab! "
      data-mascot-limit="1"
    >
      <div class="hero-canvas-wrapper">
        <canvas class="hero-webgl"></canvas>
      </div>
    </section>

    <section
      class="section hover-target"
      id="creation-section"
      data-mascot-event="both"
      data-mascot-messages="кастомизируй жука так, как тебе нравится!"
      data-mascot-limit="1"

      <!-- ===================== ПАНЕЛЬ 1: только color picker ===================== -->
      <!-- data-color-target задаёт имя, под которым выбранный цвет появится
         в window.panelColors и в событии colorchange -->
      <!-- ЦВЕТ ТЕЛА -->
      <div
        id="panel-body-color"
        class="panel transparent-material panel--anchored"
        data-color-target="bodyColor"
        style="display: none"
      >
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/web-poster-3-module/Body Color icon.svg" alt="" />
          </span>
          <span>цвет тела:</span>
        </div>
        <!-- внутреннее содержание панели -->

          <div class="hue-slider-wrap">
            <div class="hue-slider" data-hue="300">
              <div class="thumb">
                <div class="thumb-fill"></div>
                <div class="preview-bubble"></div>
              </div>
            </div>
          </div>
        </div>
