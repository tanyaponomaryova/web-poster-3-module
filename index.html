<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/style.css" />
    <link rel="stylesheet" href="src/camera.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUG LAB</title>
  </head>

  <body>
    <!-- #region Маскот -->
    <!-- плашка под маскотом -->
    <div class="mascot-widget transparent-material">
      <!-- всплывающая плашка с комментариями
      <div class="mascot-message is-visible">
        <span></span>
      </div> -->
      <!-- белая "голова" -->
      <button class="mascot-head"></button>
      <!-- движущееся "лицо" -->
      <div class="mascot-face">
        <img src="/mascot-face.svg" alt="" />
      </div>
    </div>
    <!-- #endregion -->

    <section class="section" id="hero-section">
      <img
        id="hero-section-background-image"
        src="/hero-section-background-image.png"
        alt=""
      />
    </section>

    <section class="section" id="creation-section">
      <!-- #region Панели Новые -->
      <!-- новые панели -->
      <!-- ===================== ПАНЕЛЬ 1: только color picker ===================== -->
      <!-- data-color-target задаёт имя, под которым выбранный цвет появится
         в window.panelColors и в событии colorchange -->
      <!-- ЦВЕТ ТЕЛА -->
      <div
        class="panel transparent-material"
        data-color-target="bodyColor"
        style="top: 40px; left: 20px"
      >
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/public/Body Color icon.svg" alt="" />
          </span>
          <span>цвет тела:</span>
        </div>
        <!-- внутреннее содержание панели -->
        <div class="panel-content">
          <div class="hue-slider-wrap">
            <div class="hue-slider" data-hue="300">
              <div class="thumb">
                <div class="thumb-fill"></div>
                <div class="preview-bubble"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- ЦВЕТ ГЛАЗ 
      data-color-target="eyeColor" -- название 
      переменной в beetleOptions, цвет которой 
      будет меняться 
      -->
      <div
        class="panel transparent-material"
        data-color-target="eyeColor"
        style="top: 40px; left: 380px"
      >
        <button class="close-btn" aria-label="Закрыть"></button>
        <div class="drag-handle">
          <span class="dot"></span><span class="dot"></span
          ><span class="dot"></span>
        </div>
        <div class="title-row">
          <span class="icon-placeholder">
            <svg viewBox="0 0 24 24">
              <path d="M4 6h16M4 12h16M4 18h10" />
            </svg>
          </span>
          <span>цвет глаз:</span>
        </div>
        <div class="panel-content">
          <div class="hue-slider-wrap">
            <div class="hue-glow"></div>
            <div class="hue-slider" data-hue="140">
              <div class="thumb">
                <div class="thumb-fill"></div>
                <div class="preview-bubble"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ФОРМА ГЛАЗ -->
      <!-- data-option-target на .icon-select задаёт имя переменной, на которую влияет выбор.
       data-default (необязательно) — какой вариант выбран изначально. -->
      <div class="panel transparent-material" style="top: 40px; left: 700px">
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/public/Eyes icon.svg" alt="" />
          </span>
          <span>форма глаз:</span>
        </div>
        <!-- внутреннее содержание панели -->
        <div class="panel-content">
          <div
            class="icon-select"
            data-option-target="eyeShapeName"
            data-default="Circle"
          >
            <button class="icon-btn" data-value="Circle" aria-label="Круг">
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8" />
              </svg>
            </button>
            <button class="icon-btn" data-value="Heart" aria-label="Сердце">
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <path
                  d="M12 20.5s-7.5-4.9-9.8-9.4C.6 7.9 2 4.6 5.1 3.9c1.9-.4 3.7.5 4.9 2.1 1.2-1.6 3-2.5 4.9-2.1 3.1.7 4.5 4 2.9 7.2C19.5 15.6 12 20.5 12 20.5z"
                />
              </svg>
            </button>
            <button class="icon-btn" data-value="Star" aria-label="Звезда">
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <path
                  d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.86L12 17.77l-6.18 3.23L7 14.14 2 9.27l7.1-1.01L12 2z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- ФОРМА ГОЛОВЫ -->
      <div class="panel transparent-material" style="top: 40px; left: 20px">
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/public/Body Color icon.svg" alt="" />
          </span>
          <span>форма головы:</span>
        </div>
        <!-- внутреннее содержание панели -->
        <div class="panel-content">
          <div
            class="icon-select"
            data-option-target="headShapeName"
            data-default="Antennae"
          >
            <button
              class="icon-btn"
              data-value="Antennae"
              aria-label="Усики Жука"
            >
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8" />
              </svg>
            </button>
            <button
              class="icon-btn"
              data-value="Deer_Horns"
              aria-label="Рога Жука Оленя"
            >
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <path
                  d="M12 20.5s-7.5-4.9-9.8-9.4C.6 7.9 2 4.6 5.1 3.9c1.9-.4 3.7.5 4.9 2.1 1.2-1.6 3-2.5 4.9-2.1 3.1.7 4.5 4 2.9 7.2C19.5 15.6 12 20.5 12 20.5z"
                />
              </svg>
            </button>
            <button
              class="icon-btn"
              data-value="Rhino_Horns"
              aria-label="Рога Жука Носорога"
            >
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <path
                  d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.86L12 17.77l-6.18 3.23L7 14.14 2 9.27l7.1-1.01L12 2z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Длина ТЕЛА -->
      <div class="panel transparent-material" style="top: 40px; left: 20px">
        <!-- кнопка закрыть -->
        <button class="close-btn" aria-label="Закрыть"></button>
        <!-- ручка для перетаскивания -->
        <div class="drag-handle">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <!-- иконка и название -->
        <div class="title-row">
          <span class="icon-placeholder">
            <img src="/public/Body Color icon.svg" alt="" />
          </span>
          <span>длина тела:</span>
        </div>
        <!-- внутреннее содержание панели -->
        <div class="panel-content">
          <div
            class="icon-select"
            data-option-target="bodyShapeName"
            data-default="Body_Medium"
          >
            <button
              class="icon-btn"
              data-value="Body_Short"
              aria-label="Короткое тело"
            >
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="8" />
              </svg>
            </button>
            <button
              class="icon-btn"
              data-value="Body_Medium"
              aria-label="Среднее тело"
            >
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <path
                  d="M12 20.5s-7.5-4.9-9.8-9.4C.6 7.9 2 4.6 5.1 3.9c1.9-.4 3.7.5 4.9 2.1 1.2-1.6 3-2.5 4.9-2.1 3.1.7 4.5 4 2.9 7.2C19.5 15.6 12 20.5 12 20.5z"
                />
              </svg>
            </button>
            <button
              class="icon-btn"
              data-value="Body_Long"
              aria-label="Длинное тело"
            >
              <svg class="icon-btn-svg" viewBox="0 0 24 24">
                <path
                  d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.86L12 17.77l-6.18 3.23L7 14.14 2 9.27l7.1-1.01L12 2z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- #endregion Панели -->
      <!-- ЖУК -->
      <div id="canvas-buttons-wrapper">

          </svg>
          <span class="label">цвет тела</span>
        </button>

    <section class="section" id="camera-section">
      <!-- ===================== ПАНЕЛЬ: ЦВЕТ ФОНА (студийный режим, webcam выкл) ===================== -->
      <div
        class="panel transparent-material"
        id="backgroundColorPanel"
        data-color-target="worldBackground"
        style="top: 40px; left: 20px"
      >
        <button class="close-btn" aria-label="Закрыть"></button>
        <div class="drag-handle">
          <span class="dot"></span><span class="dot"></span
          ><span class="dot"></span>
        </div>
        <div class="title-row">
          <span>цвет фона:</span>
        </div>
        <div class="panel-content">
          <div class="hue-slider-wrap">
            <div class="hue-glow"></div>
            <div class="hue-slider" data-hue="260">
              <div class="thumb">
                <div class="thumb-fill"></div>
                <div class="preview-bubble"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===================== ПАНЕЛЬ: МАСШТАБ ЖУКА НА ЛАДОНИ (webcam вкл) ===================== -->
      <div
        class="panel transparent-material"
        id="handScalePanel"
        data-value-target="handBeetleScale"
        style="top: 40px; left: 20px; display: none"
      >
        <button class="close-btn" aria-label="Закрыть"></button>
        <div class="drag-handle">
          <span class="dot"></span><span class="dot"></span
          ><span class="dot"></span>
        </div>
        <div class="title-row">
          <span>размер жука:</span>
        </div>
        <div class="panel-content">
          <div class="hue-slider-wrap">
            <div
              class="range-slider"
              data-min="0.5"
              data-max="2"
              data-value="1"
            >
              <div class="thumb">
                <div class="thumb-fill"></div>
                <div class="preview-bubble"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- CAMERA SCREEN -->
      <div class="camera-screen" id="cameraScreen">
        <!-- Градиентный фон студийного режима (Canvas2D — участвует и в фото) -->
        <canvas id="studio-backdrop"></canvas>

        <!-- Three.js canvas студийного режима: жук + OrbitControls (pan/zoom), webcam выключена -->
        <canvas id="studio-canvas"></canvas>

        <video id="video" autoplay playsinline muted></video>

        <!-- Three.js canvas AR-режима: жук на ладони, webcam включена -->
        <canvas id="three-canvas"></canvas>

        <!-- Flash -->
        <div class="flash" id="flash"></div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">
        <button class="button" id="cameraBtn" disabled>Загрузка модели…</button>

        <button class="button" id="photoBtn" aria-label="Сделать фото">
          Фото
        </button>
      </div>
    </section>

    <svg id="grid-overlay">
      <path id="v1"></path>
      <path id="v2"></path>
      <path id="h1"></path>
      <path id="h2"></path>
    </svg>
  </body>
